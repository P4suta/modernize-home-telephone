[package]
name = "phone-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tower = { version = "0.5", features = ["util"] }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hmac = "0.12"
hound = "3.5"
phone-core = { path = "../phone-core" }
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
utoipa = { version = "5", features = ["uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
ece = "2.4.2"
openssl = "0.10.82"

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tempfile = "3"

[lints]
workspace = true
