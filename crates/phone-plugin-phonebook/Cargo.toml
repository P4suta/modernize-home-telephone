[package]
name = "phone-plugin-phonebook"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
brotli-decompressor = "6.3.2"
futures-util = "0.3"
phone-core = { path = "../phone-core" }
reqwest = { version = "0.13.5", features = ["stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
url = "2"

[dev-dependencies]
axum = "0.8.9"
brotli = "9.1.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
