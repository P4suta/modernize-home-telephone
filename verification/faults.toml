source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::review_checks_native_values_without_submitting_or_consuming_the_revision"
invariant = "Review validates native values without a device write."
previous_gap = "The console API provided submission without a headless validation operation."
enforcement = "Valid and invalid reviews preserve the write count and allow the unchanged reviewed revision to submit once."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_login_reads_and_revokes_its_own_private_session_without_a_browser"
invariant = "CLI authentication remains independent from browser storage."
previous_gap = "Only browser interaction could create and revoke a management session."
enforcement = "A subprocess authenticates, reads state, and revokes its private session without retaining the device password."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_public_plans_are_validated_single_use_and_reconciled"
invariant = "A reviewed plan permits one submission across concurrent processes and copied files."
previous_gap = "Headless submission had no shared review or persistent claim."
enforcement = "Concurrent attempts produce one confirmed write and one local refusal, copied plans remain consumed, and reconciliation observes public values."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_plan_and_private_secret_changes_cannot_authorize_an_unreviewed_write"
invariant = "A plan binds public values and resolved private secrets without disclosing them."
previous_gap = "A secret reference alone could change after review."
enforcement = "Modified public values and secret contents refuse writes, while an unchanged secret produces an explicit verification requirement."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_ambiguous_and_stale_writes_never_retry_or_report_success"
invariant = "Stale or ambiguous submissions never become successful automatic retries."
previous_gap = "A headless adapter could lose the browser reconciliation discipline."
enforcement = "External changes prevent submission, native failure remains uncertain, consumed plans refuse replay, and a fresh read reports current public values."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_private_inputs_refuse_permissions_links_pipes_and_plaintext_secrets"
invariant = "CLI private inputs have bounded regular-file and permission checks."
previous_gap = "Inherited FIFO permissions could trigger a permission refusal before the intended file-type check."
enforcement = "A private FIFO must produce the file-type refusal, while other cases reject unsafe permissions, links, plaintext secrets, malformed input, or empty changes without a write."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_credentials_do_not_follow_redirects_and_invalid_responses_cannot_leak_secrets"
invariant = "Remote responses cannot redirect credentials or expose secret values."
previous_gap = "A generic HTTP client could follow login redirects or print invalid server fields."
enforcement = "A redirect never reaches its sink, and malformed secret snapshots and error bodies produce no sensitive output."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_sessions_bind_plans_and_accept_credentials_from_a_private_pipe"
invariant = "A plan cannot cross independently authenticated CLI sessions."
previous_gap = "A revision or plan file alone could be mistaken for session authority."
enforcement = "Another session cannot submit the plan, and piped administrator credentials remain absent from retained state and output."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_incomplete_login_revokes_an_issued_cookie_without_retaining_credentials"
invariant = "An incomplete CLI login revokes any known issued session."
previous_gap = "A malformed response could leave an untracked native-authenticated session active until expiry."
enforcement = "A successful cookie with an invalid body causes one authenticated revocation and leaves no session file or sensitive diagnostic."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_output_failures_return_errors_without_panics_or_replaying_writes"
invariant = "CLI output failures return command errors while preserving single-use submission claims."
previous_gap = "Printing macros could panic when the receiving process closed an output socket."
enforcement = "Broken output after submission and broken error output after a stale refusal return command failure, preserve the single native write, and leave both plans consumed."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_human_output_explains_the_workflow_and_preserves_machine_results"
invariant = "Human presentation preserves redaction and the exact submission outcome."
previous_gap = "Interactive users received raw JSON without a readable workflow or recovery action."
enforcement = "A synthetic workflow checks greetings, documentation, public changes, hidden secrets, independent verification, JSON output, and logout."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_human_output_neutralizes_terminal_controls_and_explains_empty_passwords"
invariant = "Device text cannot inject terminal controls into human output."
previous_gap = "Human presentation introduced a boundary where escaped JSON values could become active terminal control sequences."
enforcement = "A device value containing an OSC clipboard sequence renders without active controls, while empty credentials receive a specific explanation without creating a session."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_selects_human_output_in_a_terminal_and_json_when_requested"
invariant = "An actual terminal receives human output and explicit JSON remains parseable."
previous_gap = "A pseudo-terminal driver closed its input and mixed its own EOF echo into captured CLI output."
enforcement = "An open input stream preserves the native pseudo-terminal while subprocesses check human output, parseable JSON, bold-only styling, and NO_COLOR."

[[cases]]
source = "crates/phone-server/tests/console_contract.rs"
test = "http_contract::cli_human_failures_preserve_uncertainty_and_explain_connection_errors"
invariant = "Human error messages preserve uncertainty and provide readable recovery actions."
previous_gap = "A diagnostic escaped its intended line breaks and left connection failures as a generic technical error."
enforcement = "A stale submission remains consumed with no write, its explanation keeps line breaks and a reconciliation command, and a refused connection receives a readable explanation."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "a_terminal_ingress_cannot_be_admitted_again_or_block_the_next_call"
invariant = "One gateway ingress channel can create at most one incoming call."
previous_gap = "Admission recognized a repeated channel only while its first call still owned the line."
enforcement = "Replay a completed ingress and require refusal, one original record, no repeated ringing, and admission of a distinct channel with the same caller."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "deleting_history_does_not_allow_a_retired_ingress_to_ring_again"
invariant = "Deleting call history cannot reopen a consumed gateway ingress."
previous_gap = "No admission identity survived terminal cleanup or deletion of its call record."
enforcement = "Delete a completed call, replay its ingress, and require no call record or ringing while a distinct ingress remains admissible."

[[cases]]
source = "crates/phone-server/tests/store_contract.rs"
test = "ingress_consumption_survives_deletion_retention_and_restart"
invariant = "Consumed ingress identities survive history deletion and restart without suppressing a new channel generation."
previous_gap = "Admission identities disappeared with live resources."
enforcement = "Reopen after deletion and retention, refuse an equivalent timestamp, and accept the same ID with a new creation instant."

[[cases]]
source = "crates/phone-server/tests/store_contract.rs"
test = "ingress_event_and_resource_admission_roll_back_together"
invariant = "Ingress consumption, its initial event, and root resource commit atomically."
previous_gap = "No storage fault exercised ingress identity consumption with event and resource insertion."
enforcement = "Abort event and resource inserts separately, require complete rollback, and then accept the same ingress."

[[cases]]
source = "crates/phone-server/tests/store_contract.rs"
test = "ingress_schema_migration_preserves_previous_calls_and_refuses_future_versions"
invariant = "Schema migration preserves existing calls and refuses unknown database versions."
previous_gap = "No migration test covered persistent ingress protection."
enforcement = "Migrate a previous schema with retained calls, verify its version, and reject a newer unsupported version."

[[cases]]
source = "crates/phone-server/tests/gateway_contract.rs"
test = "ingress_identity_requires_valid_creation_metadata_and_normalizes_offsets"
invariant = "Ingress identity includes a validated canonical creation instant."
previous_gap = "A process restart can reuse an Asterisk channel ID."
enforcement = "Normalize equivalent offsets, distinguish creation instants, and refuse missing or invalid identity metadata."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "stale_gateway_events_cannot_reuse_or_terminate_another_channel_generation"
invariant = "Lifecycle events belong to the exact channel generation that produced them."
previous_gap = "Active root matching discarded channel creation metadata."
enforcement = "Deliver a stale terminal event through the gateway WebSocket, wait for a causal event barrier, and preserve the newer call while refusing competing generations."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "rejected_ingress_cleanup_failure_blocks_admission_until_reconciled"
invariant = "Rejected live ingress remains recoverable after cleanup failure."
previous_gap = "A refused ingress could return without tracking an orphan channel."
enforcement = "Fail rejected-channel deletion, require quarantine and durable tracking, then reconcile before admitting another call."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "rejected_orphan_quarantine_preserves_the_active_call"
invariant = "Unowned-channel quarantine preserves an already-owned live call."
previous_gap = "The unavailable gate could delete the active root before checking its identity."
enforcement = "Fail orphan cleanup beside an active call and require idempotent acceptance of its live root without ending it."

[[cases]]
source = "crates/phone-server/tests/store_contract.rs"
test = "concurrent_ingress_admission_commits_one_initial_event"
invariant = "Concurrent ingress attempts can commit one initial call and event."
previous_gap = "A second active-call constraint could mask missing ingress deduplication."
enforcement = "Require one explicit replay outcome, one accepted outcome, and one call, event, outbox row, and root."

[[cases]]
source = "crates/phone-server/tests/store_contract.rs"
test = "a_failed_ingress_migration_preserves_the_previous_schema"
invariant = "Failed migration leaves the previous schema and retained data intact."
previous_gap = "An interrupted multi-statement migration could leave a partial ingress table."
enforcement = "Force migration failure after table creation and require the previous version without the new table."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "malformed_ingress_cannot_delete_live_root_or_peer_channels"
invariant = "Invalid ingress metadata cannot delete channels belonging to the active call."
previous_gap = "Orphan rejection tests omitted malformed events naming an active root or peer."
enforcement = "Reject missing creation metadata for the live root and both peers, preserve resources and readiness, and accept the valid repeated root without gateway effects."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "gateway_admission_preserves_numbers_and_normalizes_unavailable_callers"
invariant = "Gateway admission preserves numeric callers and normalizes unavailable incoming identity."
previous_gap = "Controller tests checked call phases without asserting caller identity across directions."
enforcement = "Admit numbered incoming, unavailable incoming, and numbered outgoing calls and verify their persisted caller and direction independently."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "valid_peer_replays_preserve_ringing_and_connected_calls"
invariant = "Valid repeated ingress cannot delete a channel retained by the active call."
previous_gap = "Ownership tests supplied missing creation metadata and omitted the busy admission branch."
enforcement = "Offer valid ringing peers and the connected winner and require no gateway request or phase change."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "endpoint_replays_preserve_the_winner_and_discard_late_losers"
invariant = "Repeated endpoint events preserve the winner while late losing endpoints remain disposable."
previous_gap = "Endpoint rejection deleted a connected winner and phase assertions could not observe the fake gateway deletion."
enforcement = "Replay native endpoint events, use causal barriers, reject winner deletion requests, and require deletion of the late loser."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "failed_busy_channel_cleanup_quarantines_the_orphan_and_preserves_the_call"
invariant = "Failed cleanup during busy admission preserves the current call and tracks the orphan for recovery."
previous_gap = "Busy admission logged deletion failures without durable tracking or quarantine."
enforcement = "Fail deletion of an unconsumed foreign root, preserve the live owner, then release and reconcile before another call."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "gateway_start_events_preserve_inbound_and_outbound_identity"
invariant = "Gateway start events preserve incoming identity and use the outgoing dial target."
previous_gap = "Direct control offers bypassed native event dispatch."
enforcement = "Send incoming and outgoing WebSocket events and verify distinct persisted calls, caller values, direction, and termination."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "browser_originator_events_dial_the_carrier_for_the_owned_root"
invariant = "A browser originator can dial the carrier through its currently owned root."
previous_gap = "No native originator event checked the root ownership guard."
enforcement = "Deliver foreign and owned originator events with causal barriers and require carrier origination for the owned root."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "gateway_terminal_events_end_the_owned_root_and_winning_peer"
invariant = "Valid terminal events release the current root or winning peer."
previous_gap = "Stale event refusal lacked positive terminal event observations."
enforcement = "Exercise both gateway terminal event variants against the root and winner and require persisted termination and released ownership."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "quarantined_calls_keep_their_deadline_and_end_once"
invariant = "Orphan quarantine preserves the current call through its normal terminal deadline."
previous_gap = "Immediate assertions could finish before an incorrect reconciliation tick destroyed ownership."
enforcement = "Fail orphan deletion during an active call, wait for its normal no-answer deadline, and require one terminal event and subsequent admission."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "a_replayed_ingress_leaves_a_new_channel_generation_with_the_same_id_alone"
invariant = "Replay cleanup deletes a channel only while the gateway still lists the replayed generation."
previous_gap = "Replay cleanup deleted by channel identifier, so a reused identifier could end a new incoming call."
enforcement = "Replay a retired ingress while the gateway lists a successor with the same identifier and count channel deletions."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "resuming_admission_cannot_reconcile_away_a_live_call"
invariant = "Resuming admission refuses to reconcile while a live call awaits recovery."
previous_gap = "A resume request reconciled gateway resources and released the line without ending the call."
enforcement = "Fail a rejected channel cleanup during a ringing call, then request resume and check the call phase and line owner."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "unavailable_read_aloud_tracks_no_media_channel"
invariant = "Read-aloud without an available provider records no media channel."
previous_gap = "Each refused read-aloud request left a tracked channel that hangup then tried to delete."
enforcement = "Repeat read-aloud on a connected call with AI off and compare the tracked resources."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "ringing_deadlines_select_reception_and_outgoing_no_answer"
invariant = "Available reception handles unanswered incoming calls while outgoing calls end without voicemail."
previous_gap = "Deadline tests covered disabled reception without distinguishing the outgoing terminal reason."
enforcement = "Use short controller deadlines with the mock provider, require incoming voicemail and capture stop before channel deletion, and require outgoing no-answer without voicemail or capture stop."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "each_cleanup_failure_retains_ownership_until_retry_succeeds"
invariant = "Every independent gateway cleanup failure retains ownership until a successful retry."
previous_gap = "Simultaneous channel and bridge failures masked weakened failure accumulation and recording-stop failures were absent."
enforcement = "Fail recording stop, channel deletion, and bridge deletion independently while other operations succeed, refuse reassignment, then recover."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "normal_cleanup_preserves_a_pending_gateway_ingress"
invariant = "Ordinary call cleanup cannot delete a later ingress awaiting admission."
previous_gap = "An empty gateway snapshot hid unnecessary global reconciliation after normal cleanup."
enforcement = "Advertise a pending application channel during normal hangup, reject its deletion, and admit the distinct next call."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "endpoint_identity_guards_reject_each_invalid_condition"
invariant = "Endpoint admission requires both the current call identity and a tracked peer."
previous_gap = "A foreign endpoint also carried a foreign call identity, masking weakened independent guards."
enforcement = "Reject a tracked peer with a foreign call identity without deletion, and delete an untracked peer with the correct call identity without connecting it."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "explicit_recording_captures_ordinary_calls_without_ai_or_provider_media"
invariant = "Explicit recording operates independently of AI reception after endpoint answer."
previous_gap = "The recording guard required AI reception, so ordinary calls with AI off never started capture."
enforcement = "An answered endpoint must start exactly one recording without provider media or announcement playback."

[[cases]]
source = "crates/phone-server/tests/manual_retention.rs"
test = "manual_retention_keeps_old_audio_and_history_until_explicit_deletion"
invariant = "Manual retention never expires an ended recording or its history because time passed."
previous_gap = "The adapter interpreted zero days as an immediate expiration deadline."
enforcement = "Keep old audio and history after four hundred days with zero-day retention."

[[cases]]
source = "crates/phone-server/tests/nas_archive_state.rs"
test = "archive_deletion_survives_restart_and_refuses_late_publication"
invariant = "Deletion preserves a durable NAS intent and prevents late publication from recreating history."
previous_gap = "History deletion had no independent remote-object lifecycle."
enforcement = "Delete a pending archive, reopen SQLite, refuse publication, and finish the retained deletion intent."

[[cases]]
source = "crates/phone-server/tests/nas_archive_state.rs"
test = "one_changed_local_copy_does_not_keep_other_archived_copies"
invariant = "A changed local copy of one archived recording neither blocks cleanup of the others nor loses its own audio."
previous_gap = "The first failed digest check ended the cache scan and the archive pass before any queued upload or deletion."
enforcement = "Archive six recordings, change one local copy, and require the other five removed and the changed one retained."

[[cases]]
source = "crates/phone-server/tests/nas_archive_state.rs"
test = "archive_receipts_require_exact_pending_bytes_and_preserve_call_faults"
invariant = "Archive ownership requires the expected pending byte count and preserves unrelated call failures."
previous_gap = "Local capture had no durable remote ownership receipt."
enforcement = "Refuse missing and mismatched intents, preserve a gateway failure through retry and commit, and refuse repeated publication."

[[cases]]
source = "crates/phone-server/tests/nas_archive_state.rs"
test = "a_successful_archive_clears_its_own_retry_error"
invariant = "Successful archive publication clears its own obsolete retry failure."
previous_gap = "A remote retry failure had no completion transition."
enforcement = "Persist an archive retry error and require its removal after verified publication."

[[cases]]
source = "xtask/tests/nas_report.rs"
test = "nas_reports_refuse_missing_repeated_skipped_and_retried_cases"
invariant = "Only an exact complete native NAS campaign satisfies the release gate."
previous_gap = "The release gate had no native SMB campaign inventory."
enforcement = "Reject empty, missing, repeated, skipped, retried, unknown, and duplicated-completion reports."

[[cases]]
source = "crates/phone-server/tests/controller_shutdown.rs"
test = "shutdown_releases_the_actor_database_owner_before_returning"
invariant = "Completed shutdown releases the actor's database ownership before another instance opens it."
previous_gap = "Shutdown acknowledged cancellation before the actor dropped its store handle."
enforcement = "Repeat immediate close and reopen on a multithreaded runtime without waiting for a favorable schedule."

[[cases]]
source = "crates/phone-server/tests/manual_retention.rs"
test = "nas_archives_ignore_legacy_expiry_and_local_spool_quota"
invariant = "Manual NAS retention preserves archived history beyond the local spool quota and legacy expiry."
previous_gap = "Local quota accounting could treat remote audio as disposable local storage."
enforcement = "Keep six archived recordings beyond the quota and four hundred days with both manual and legacy settings."

[[cases]]
source = "crates/phone-server/tests/recording_settings.rs"
test = "nas_settings_migrate_effective_retention_without_applying_legacy_expiry"
invariant = "The NAS settings response exposes manual retention despite a persisted legacy value."
previous_gap = "The settings form loaded thirty days and submitted a value refused by the NAS policy."
enforcement = "Load persisted legacy settings through the authenticated HTTP endpoint and require zero-day manual retention."

[[cases]]
source = "xtask/tests/manager.rs"
test = "restore_relocates_the_recording_spool_and_preserves_the_nas_identity"
invariant = "A restored installation uses its own bounded spool while preserving access to its NAS archive."
previous_gap = "Restore changed the data directory and installation identity without relocating recording paths."
enforcement = "Restore a sealed backup and compare the relocated spool, stable archive identity, and replaced installation identity."

[[cases]]
source = "crates/phone-server/tests/secrets_contract.rs"
test = "optional_nas_and_notification_credentials_fail_independently"
invariant = "Unavailable credentials for one optional plugin leave other plugins and ordinary calls available."
previous_gap = "Loading optional credentials together could disable otherwise usable integrations."
enforcement = "Exercise both independent credential availability states and malformed NAS inputs while preserving notification credentials."

[[cases]]
source = "crates/phone-server/tests/secrets_contract.rs"
test = "literal_secret_files_preserve_password_whitespace"
invariant = "Literal private credential files preserve significant password whitespace."
previous_gap = "Trimming whole lines silently changed passwords with trailing spaces."
enforcement = "Parse indented comments and CRLF records while preserving leading and trailing password spaces."

[[cases]]
source = "crates/phone-server/tests/secrets_contract.rs"
test = "nas_credential_export_preserves_call_secrets_and_refuses_colliding_names"
invariant = "NAS credential staging preserves telephone credentials and refuses overwrites or shared secret names."
previous_gap = "Credential staging and SMB execution duplicated a grammar that rejected account names containing spaces."
enforcement = "Stage a spaced username exactly, and verify literal values, private permissions, overwrite refusal, missing-input refusal, and secret-name isolation."

[[cases]]
source = "crates/phone-plugin-nas/src/lib.rs"
test = "tests::command_keeps_passwords_off_arguments_and_bounds_the_child"
invariant = "A spaced SMB account name remains one argument while passwords remain outside process arguments."
previous_gap = "The command fixture used an account name without spaces, leaving an overly restrictive constructor unobserved."
enforcement = "Construct a spaced account, inspect its complete user argument, and require bounded child execution without a password argument."

[[cases]]
source = "crates/phone-plugin-nas/src/lib.rs"
test = "tests::usernames_preserve_spaces_and_domain_separators_within_the_byte_limit"
invariant = "Credential staging and SMB execution share one bounded account-name grammar that preserves spaces."
previous_gap = "Separate validators rejected legitimate spaced names without a shared boundary contract."
enforcement = "Accept account spaces, domain separators, and the exact byte limit while rejecting blank names, command syntax, controls, and oversized values."

[[cases]]
source = "crates/phone-server/tests/controller_contract.rs"
test = "a_full_recording_spool_preserves_calls_and_recovers_after_space_is_freed"
invariant = "A full recording spool suspends capture while preserving ordinary calls and permits recording after capacity recovers."
previous_gap = "Capture tests checked the reservation policy without observing connected calls across an actual spool quota failure."
enforcement = "Fill the configured spool quota, require a connected unrecorded call, free space, and require the next connected call to start capture without AI media."

[[cases]]
source = "crates/phone-server/tests/config_contract.rs"
test = "nas_directory_segments_match_the_archive_adapters_input_limits"
invariant = "Configuration validation refuses directory segments that the NAS adapter cannot address."
previous_gap = "The configuration checker bounded the entire directory while the adapter also bounded each segment."
enforcement = "Accept a segment at 128 bytes and refuse the first unsupported byte before runtime."

[[cases]]
source = "crates/phone-server/tests/nas_archive_contract.rs"
test = "isolated_smb_archive_preserves_verified_audio_and_recovers_durable_work"
invariant = "Native SMB effects preserve verified audio and durable ownership through storage and process faults."
previous_gap = "Database and HTTP mocks left authentication, remote disk exhaustion, child cancellation, and runtime-user permissions unobserved."
enforcement = "Execute the bounded native SMB binary with synthetic data; the independent case collector requires the complete expected inventory."
