[workspace]
members = ["crates/phone-core", "crates/phone-server", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
